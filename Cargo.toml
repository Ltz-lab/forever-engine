[package]
name = "forever-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust simulation engine for WoW Forever"
# The accepted fixtures are test evidence only; the build reads none of them.
exclude = ["fixtures/"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Reads the accepted fixtures kept gzip-compressed (tests/support/fixtures.rs). Tests only,
# so the shipped engine and wasm builds do not link it.
[dev-dependencies]
flate2 = "1"

[build-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# The accepted fixtures simulate over half a million fights against their Go goldens, which
# takes about 17 minutes of CPU unoptimized. Light optimization of the test build cuts that
# eightfold and costs less to compile than opt-level 2 or 3, which barely run faster. It
# changes how fast the engine runs, never what it computes: Rust does not fuse a multiply and
# an add unless asked (`mul_add`) at any optimization level, and debug assertions and
# overflow checks stay on. The release profile and the architecture check do not use it.
[profile.test]
opt-level = 1
